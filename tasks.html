<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1322">
    <title>Weekly Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Dark glass theme, matched to the Semester Budget app.
           These styles live only in this page, so the TimeBudget
           pages (index.html + css/styles.css) are not affected. */
        :root {
            color-scheme: dark;
            --font:         -apple-system, BlinkMacSystemFont, "SF Pro Text", "DM Sans", system-ui, sans-serif;
            --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "DM Sans", system-ui, sans-serif;
            --bg:           #070a12;
            --text:         #F3F6FC;
            --muted:        #9AA4B8;
            --faint:        #6E788C;
            --accent:       #7FB2FF;
            --accent-strong:#3B82F6;
            --success:      #5FD38D;
            --danger:       #FF7070;
            --hairline:     rgba(255,255,255,0.08);
            --glass:        linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.035));
            --glass-solid:  rgba(22,28,42,0.94);
            --glass-border: rgba(255,255,255,0.13);
            --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 12px 32px rgba(0,0,0,0.35);
            --blur:         blur(20px) saturate(150%);
            --field:        rgba(255,255,255,0.06);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { background: var(--bg); }

        body {
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Dark gradient with soft color glows, pinned behind everything */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(70% 45% at 10% -5%, rgba(64,110,200,0.42), transparent 70%),
                radial-gradient(55% 40% at 105% 28%, rgba(90,130,210,0.20), transparent 70%),
                radial-gradient(60% 45% at 85% 75%, rgba(50,170,120,0.12), transparent 70%),
                radial-gradient(60% 40% at 0% 100%, rgba(80,90,180,0.16), transparent 70%),
                linear-gradient(180deg, #0d1626 0%, #080c16 45%, #05070c 100%);
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Shared glass surface */
        .day-card, .week-nav, .back-link {
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
        }

        /* ── Header ─────────────────────────────────── */

        .header {
            padding: calc(22px + env(safe-area-inset-top)) 22px 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .app-icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            margin-bottom: 16px;
            color: #EAF2FF;
            background: linear-gradient(160deg, #5C8FD6 0%, #2D5394 100%);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 24px rgba(40,90,180,0.35);
        }

        .app-icon svg { width: 26px; height: 26px; }

        .header h1 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--text);
        }

        .back-link {
            display: inline-block;
            margin-top: 7px;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .back-link:hover { background: rgba(255,255,255,0.12); }
        .back-link:active { transform: scale(0.98); }

        #header-summary {
            margin-top: 6px;
            font-size: 15px;
            font-weight: 400;
            color: var(--muted);
        }

        /* ── Week Navigation (pill bar) ──────────────── */

        .week-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin: 18px 16px 0;
            padding: 5px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 24px rgba(0,0,0,0.25);
        }

        .nav-btn {
            background: linear-gradient(180deg, rgba(130,170,240,0.42), rgba(80,115,180,0.28));
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 4px 14px rgba(30,60,120,0.45);
            color: #fff;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            border-radius: 999px;
            padding: 9px 14px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: filter 0.15s;
        }

        .nav-btn:hover { filter: brightness(1.15); }
        .nav-btn:active { transform: scale(0.98); }

        .week-label {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .wl-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .wl-range {
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
            margin-top: 2px;
        }

        /* ── Days Container ──────────────────────────── */

        .days {
            padding: 18px 16px calc(80px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ── Day Card ────────────────────────────────── */

        .day-card {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--glass-shadow);
        }

        .day-card.today {
            background:
                radial-gradient(90% 80% at 100% 100%, rgba(91,155,255,0.16), transparent 70%),
                var(--glass);
            border-color: rgba(127,178,255,0.38);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.14),
                        0 12px 32px rgba(0,0,0,0.35),
                        0 0 24px rgba(59,130,246,0.18);
        }

        .day-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 16px 20px 12px;
        }

        .day-name {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .today .day-name { color: #fff; }

        .day-date {
            margin-top: 2px;
            font-size: 13px;
            font-weight: 400;
            color: var(--muted);
        }

        /* ── Badges ──────────────────────────────────── */

        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            flex-shrink: 0;
            border: 1px solid transparent;
        }

        .badge-today {
            background: linear-gradient(180deg, rgba(91,155,255,0.45), rgba(59,130,246,0.30));
            border-color: rgba(127,178,255,0.45);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
            color: #fff;
        }
        .badge-rem {
            background: rgba(127,178,255,0.12);
            border-color: rgba(127,178,255,0.28);
            color: var(--accent);
        }
        .badge-done {
            background: rgba(95,211,141,0.15);
            border-color: rgba(95,211,141,0.28);
            color: var(--success);
        }

        /* ── Task Items ──────────────────────────────── */

        .task-list { margin: 0 20px; }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 0;
            border-top: 1px solid var(--hairline);
        }

        /* Custom round checkbox */
        .task-cb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.28);
            background: rgba(255,255,255,0.05);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .task-cb:hover:not(:checked) { border-color: var(--success); }

        .task-cb:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.35);
        }

        .task-cb:checked {
            background: linear-gradient(160deg, #6FE09C, #2FA866);
            border-color: rgba(95,211,141,0.9);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 0 10px rgba(95,211,141,0.35);
        }

        .task-cb:checked::after {
            content: '';
            position: absolute;
            left: 6.5px;
            top: 3px;
            width: 5px;
            height: 10px;
            border: 2px solid #fff;
            border-top: none;
            border-left: none;
            transform: rotate(42deg);
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            line-height: 1.4;
            color: var(--text);
            word-break: break-word;
        }

        .task-item.done .task-text {
            text-decoration: line-through;
            color: var(--faint);
        }

        .task-del {
            background: none;
            border: none;
            padding: 4px 6px;
            font-size: 15px;
            line-height: 1;
            color: var(--muted);
            cursor: pointer;
            border-radius: 8px;
            opacity: 0.55;
            flex-shrink: 0;
            transition: opacity 0.15s, color 0.15s;
        }

        .task-del:hover {
            opacity: 1;
            color: var(--danger);
        }

        /* ── Add Task ────────────────────────────────── */

        .add-section {
            padding: 6px 20px 16px;
        }

        .task-list:not(:empty) + .add-section {
            margin: 0 20px;
            padding: 10px 0 16px;
            border-top: 1px solid var(--hairline);
        }

        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: none;
            border: none;
            color: var(--accent);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
            opacity: 0.9;
            transition: opacity 0.15s;
        }

        .add-btn:hover { opacity: 1; }

        .input-row {
            display: none;
            align-items: center;
            gap: 8px;
        }

        .input-row.open { display: flex; }

        .task-input {
            flex: 1;
            min-width: 0;
            background: var(--field);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px 13px;
            font-family: var(--font);
            font-size: 16px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .task-input::placeholder { color: var(--faint); }

        .task-input:focus {
            border-color: rgba(127,178,255,0.65);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.22);
        }

        .btn-confirm,
        .btn-cancel {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: var(--font);
            transition: filter 0.15s, border-color 0.15s, color 0.15s;
        }

        .btn-confirm {
            background: linear-gradient(180deg, rgba(91,155,255,0.38), rgba(59,130,246,0.24));
            border: 1px solid rgba(127,178,255,0.45);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 22px rgba(59,130,246,0.18);
            color: #fff;
        }

        .btn-confirm:hover { filter: brightness(1.15); }

        .btn-cancel {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--glass-border);
            color: var(--muted);
        }

        .btn-cancel:hover {
            border-color: rgba(255,112,112,0.5);
            color: var(--danger);
        }

        .btn-confirm:active, .btn-cancel:active { transform: scale(0.96); }

        /* ── Sync pill + sign-in sheet from js/cloud-sync.js ──
           Restyled here only, so the TimeBudget page keeps its own look. */

        #cloudsync-pill {
            background: linear-gradient(180deg, rgba(60,72,98,0.6), rgba(30,38,56,0.6)) !important;
            color: var(--text) !important;
            border: 1px solid var(--glass-border) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 8px 24px rgba(0,0,0,0.45) !important;
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
            font: 500 13px/1 var(--font) !important;
            padding: 9px 14px !important;
            opacity: 1 !important;
        }
        #cloudsync-sheet { background: rgba(0,0,0,0.55) !important; font-family: var(--font) !important; }
        #cloudsync-sheet form {
            background: #121826 !important;
            color: var(--text) !important;
            border: 1px solid var(--glass-border);
            border-bottom: none;
        }
        #cloudsync-sheet form > div { color: var(--muted); }
        #cloudsync-sheet b { color: var(--text); }
        #cloudsync-sheet input {
            background: var(--field) !important;
            color: var(--text) !important;
            border: 1px solid var(--glass-border) !important;
        }
        #cloudsync-sheet [data-signin] {
            background: linear-gradient(180deg, rgba(91,155,255,0.45), rgba(59,130,246,0.32)) !important;
            color: #fff !important;
            border: 1px solid rgba(127,178,255,0.45) !important;
        }
        #cloudsync-sheet [data-create] {
            background: rgba(255,255,255,0.06) !important;
            color: var(--text) !important;
            border-color: var(--glass-border) !important;
        }
        #cloudsync-sheet a, #cloudsync-sheet [data-x] { color: var(--muted) !important; }
        #cloudsync-sheet [data-msg] { filter: brightness(1.7); }

        /* Fallback where backdrop blur isn't available, or less transparency is asked for */
        @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
            .day-card, .day-card.today { background: var(--glass-solid); }
            .week-nav, .back-link, #cloudsync-pill { background: rgba(26,32,48,0.96) !important; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .day-card, .day-card.today { background: var(--glass-solid); }
            .week-nav, .back-link, #cloudsync-pill { background: rgba(26,32,48,0.96) !important; }
        }

        /* Narrow phones: keep the week bar on one line */
        @media (max-width: 360px) {
            .nav-btn { padding: 8px 11px; font-size: 13px; }
            .header h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="app">

    <header class="header">
        <div>
            <div class="app-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="3.5" width="16" height="17" rx="3"/>
                    <path d="M8 9.5l1.6 1.6L12.5 8"/>
                    <path d="M8 15.5l1.6 1.6 2.9-3.1"/>
                    <line x1="14.5" y1="10" x2="17" y2="10"/>
                    <line x1="14.5" y1="16" x2="17" y2="16"/>
                </svg>
            </div>
            <h1>Weekly Planner</h1>
            <div id="header-summary"></div>
        </div>
        <a class="back-link" href="index.html">← TimeBudget</a>
    </header>

    <nav class="week-nav">
        <button class="nav-btn" id="btn-prev">← Previous</button>
        <div class="week-label">
            <div class="wl-title" id="wl-title"></div>
            <div class="wl-range"  id="wl-range"></div>
        </div>
        <button class="nav-btn" id="btn-next">Next →</button>
    </nav>

    <main class="days" id="days"></main>

</div>
<script>
'use strict';

const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let weekOffset = 0;

/* ── Utilities ─────────────────────────────────────────── */

function getMonday(base) {
    const d = new Date(base);
    d.setHours(0, 0, 0, 0);
    const dow = d.getDay();                       // 0 = Sunday
    d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
    return d;
}

function dateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const n = String(d.getDate()).padStart(2, '0');
    return `planner-${y}-${m}-${n}`;
}

function shortDate(d) {
    return `${MON_SHORT[d.getMonth()]} ${d.getDate()}`;
}

function isToday(d) {
    const now = new Date();
    return d.getFullYear() === now.getFullYear()
        && d.getMonth()    === now.getMonth()
        && d.getDate()     === now.getDate();
}

function esc(s) {
    return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function load(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; }
    catch { return []; }
}

function persist(key, tasks) {
    localStorage.setItem(key, JSON.stringify(tasks));
    if (window.CloudSync) window.CloudSync.save();
}

/* ── Badge HTML ────────────────────────────────────────── */

function badgeHtml(isTodayCard, tasks) {
    if (isTodayCard) return '<span class="badge badge-today">Today</span>';
    const rem = tasks.filter(t => !t.done).length;
    if (tasks.length && rem === 0) return '<span class="badge badge-done">Done ✓</span>';
    if (rem > 0)                   return `<span class="badge badge-rem">${rem} left</span>`;
    return '';
}

/* ── Header Summary ────────────────────────────────────── */

function refreshSummary() {
    const tasks = load(dateKey(new Date()));
    const rem   = tasks.filter(t => !t.done).length;
    const el    = document.getElementById('header-summary');
    if (!tasks.length) {
        el.textContent = 'No tasks planned for today';
    } else if (!rem) {
        el.textContent = 'All tasks done for today ✓';
    } else {
        el.textContent = `${rem} task${rem !== 1 ? 's' : ''} remaining today`;
    }
}

/* ── Render Task List ──────────────────────────────────── */

function renderTasks(key) {
    const list = document.getElementById('tl-' + key);
    if (!list) return;
    const tasks = load(key);
    list.innerHTML = '';
    tasks.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'task-item' + (t.done ? ' done' : '');
        div.innerHTML = `
            <input type="checkbox" class="task-cb"${t.done ? ' checked' : ''}>
            <span class="task-text">${esc(t.text)}</span>
            <button class="task-del" title="Remove task">✕</button>
        `;
        div.querySelector('.task-cb') .addEventListener('change', () => toggleTask(key, i));
        div.querySelector('.task-del').addEventListener('click',  () => removeTask(key, i));
        list.appendChild(div);
    });
}

/* ── Task Mutations ────────────────────────────────────── */

function addTask(key) {
    const inp  = document.getElementById('inp-' + key);
    const text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    const tasks = load(key);
    tasks.push({ text, done: false });
    persist(key, tasks);
    closeInput(key);
    renderTasks(key);
    refreshBadge(key);
    refreshSummary();
}

function toggleTask(key, i) {
    const tasks = load(key);
    tasks[i].done = !tasks[i].done;
    persist(key, tasks);
    renderTasks(key);
    refreshBadge(key);
    refreshSummary();
}

function removeTask(key, i) {
    const tasks = load(key);
    tasks.splice(i, 1);
    persist(key, tasks);
    renderTasks(key);
    refreshBadge(key);
    refreshSummary();
}

/* ── Badge Refresh (without full re-render) ────────────── */

function refreshBadge(key) {
    const card = document.querySelector(`.day-card[data-key="${key}"]`);
    if (!card || card.classList.contains('today')) return;
    const hd  = card.querySelector('.day-hd');
    const old = hd.querySelector('.badge');
    if (old) old.remove();
    const html = badgeHtml(false, load(key));
    if (html) hd.insertAdjacentHTML('beforeend', html);
}

/* ── Input Show / Hide ─────────────────────────────────── */

function openInput(key) {
    document.querySelector(`[data-add="${key}"]`).style.display = 'none';
    document.getElementById('row-' + key).classList.add('open');
    document.getElementById('inp-' + key).focus();
}

function closeInput(key) {
    document.getElementById('inp-' + key).value = '';
    document.getElementById('row-' + key).classList.remove('open');
    document.querySelector(`[data-add="${key}"]`).style.display = '';
}

/* ── Render Week ───────────────────────────────────────── */

function renderWeek() {
    const now = new Date();
    const mon = getMonday(now);
    mon.setDate(mon.getDate() + weekOffset * 7);

    const sun = new Date(mon);
    sun.setDate(sun.getDate() + 6);

    // Navigation label
    const knownTitles = { '-1': 'Last Week', '0': 'This Week', '1': 'Next Week' };
    document.getElementById('wl-title').textContent =
        knownTitles[String(weekOffset)]
        ?? (weekOffset > 0 ? `+${weekOffset} weeks` : `${weekOffset} weeks`);
    document.getElementById('wl-range').textContent =
        `${shortDate(mon)} – ${shortDate(sun)}`;

    // Build day cards
    const container = document.getElementById('days');
    container.innerHTML = '';

    for (let i = 0; i < 7; i++) {
        const date       = new Date(mon);
        date.setDate(date.getDate() + i);
        const key        = dateKey(date);
        const todayCard  = isToday(date);
        const tasks      = load(key);

        const card = document.createElement('div');
        card.className   = 'day-card' + (todayCard ? ' today' : '');
        card.dataset.key = key;

        card.innerHTML = `
            <div class="day-hd">
                <div>
                    <div class="day-name">${DAY_NAMES[i]}</div>
                    <div class="day-date">${shortDate(date)}</div>
                </div>
                ${badgeHtml(todayCard, tasks)}
            </div>
            <div class="task-list" id="tl-${key}"></div>
            <div class="add-section">
                <button class="add-btn" data-add="${key}">
                    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"
                         stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        <line x1="5.5" y1="1"   x2="5.5" y2="10"/>
                        <line x1="1"   y1="5.5" x2="10"  y2="5.5"/>
                    </svg>
                    Add Task
                </button>
                <div class="input-row" id="row-${key}">
                    <input
                        class="task-input"
                        id="inp-${key}"
                        type="text"
                        placeholder="What needs to get done?"
                        autocomplete="off"
                    >
                    <button class="btn-confirm" title="Add task">✓</button>
                    <button class="btn-cancel"  title="Cancel">✕</button>
                </div>
            </div>
        `;

        container.appendChild(card);
        renderTasks(key);

        // Wire up events for this card
        card.querySelector('[data-add]')   .addEventListener('click',  () => openInput(key));
        card.querySelector('.btn-confirm') .addEventListener('click',  () => addTask(key));
        card.querySelector('.btn-cancel')  .addEventListener('click',  () => closeInput(key));
        card.querySelector('.task-input')  .addEventListener('keydown', e => {
            if (e.key === 'Enter')  addTask(key);
            if (e.key === 'Escape') closeInput(key);
        });
    }
}

/* ── Navigation ────────────────────────────────────────── */

document.getElementById('btn-prev').addEventListener('click', () => { weekOffset--; renderWeek(); });
document.getElementById('btn-next').addEventListener('click', () => { weekOffset++; renderWeek(); });

/* ── Init ──────────────────────────────────────────────── */

renderWeek();
refreshSummary();

// Another device changed tasks: redraw (called by js/planner-sync.js)
window.plannerReload = () => { renderWeek(); refreshSummary(); };
</script>
<script src="js/engine.js"></script>
<script type="module" src="js/planner-sync.js"></script>
</body>
</html>

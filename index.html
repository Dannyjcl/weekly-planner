<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0c0f">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c0f'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ffab2e' stroke-width='4' stroke-dasharray='44 63' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
    <title>TimeBudget — 168 hours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            <span class="brand-mark">TIMEBUDGET</span>
            <span class="brand-sub hide-sm">168 H / WK</span>
        </div>
        <div class="weeknav">
            <button class="btn icon" data-action="week-prev" aria-label="Previous week">←</button>
            <div class="label"><b id="week-title"></b><span id="week-range"></span></div>
            <button class="btn icon" data-action="week-next" aria-label="Next week">→</button>
            <button class="btn sm ghost" data-action="week-today" id="btn-today">Today</button>
        </div>
        <select class="plan-select" id="plan-select" aria-label="Plan: base week or scenario"></select>
    </div>
    <nav class="tabs" role="tablist">
        <button class="tab" data-tab="overview">Overview</button>
        <button class="tab" data-tab="schedule">Schedule</button>
        <button class="tab" data-tab="budget">Budget &amp; Targets</button>
        <button class="tab" data-tab="scenarios">Scenarios</button>
        <button class="tab" data-tab="whatif">What-If</button>
        <button class="tab" data-tab="history">History</button>
    </nav>
</header>

<main>
    <div id="banner"></div>
    <section class="view" id="view-overview"></section>
    <section class="view" id="view-schedule"></section>
    <section class="view" id="view-budget"></section>
    <section class="view" id="view-scenarios"></section>
    <section class="view" id="view-whatif"></section>
    <section class="view" id="view-history"></section>
</main>

<footer class="foot">
    <span>Data is stored in this browser only.</span>
    <button class="btn sm ghost" data-action="export">Export JSON</button>
    <button class="btn sm ghost" data-action="import">Import JSON</button>
    <button class="btn sm ghost" data-action="reset">Reset…</button>
    <span class="spacer"></span>
    <a href="tasks.html">Daily task list →</a>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
</footer>

<dialog id="dlg"></dialog>
<div class="tooltip hidden" id="tooltip" role="tooltip"></div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
